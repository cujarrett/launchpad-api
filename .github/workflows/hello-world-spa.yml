name: hello-world-spa

on:
  push:
    branches: [main]
    paths:
      - 'hello-world-spa/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: hello-world-spa
          platforms: linux/arm64
          sbom: true
          push: true
          tags: |
            ghcr.io/cujarrett/hello-world-spa:latest
            ghcr.io/cujarrett/hello-world-spa:sha-${{ github.sha }}
          cache-from: type=gha,scope=hello-world-spa
          cache-to: type=gha,mode=max,scope=hello-world-spa
