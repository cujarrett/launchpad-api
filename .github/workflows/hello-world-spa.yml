name: hello-world-spa

on:
  push:
    branches: [main]
    paths:
      - 'hello-world-spa/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: hello-world-spa
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/cujarrett/hello-world-spa:latest
            ghcr.io/cujarrett/hello-world-spa:sha-${{ github.sha }}
