<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launchpad Sandbox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f0f6fc;
    }

    header p {
      margin-top: 6px;
      font-size: 0.875rem;
      color: #8b949e;
    }

    .workspace-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-family: monospace;
      background: #161b22;
      border: 1px solid #30363d;
      color: #58a6ff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px 16px;
      transition: border-color 0.2s;
    }

    .card.ok { border-color: #238636; }
    .card.unavailable { border-color: #da3633; }
    .card.not_configured { border-color: #30363d; opacity: 0.6; }

    .card-name {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .card-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ok .dot { background: #3fb950; }
    .unavailable .dot { background: #f85149; }
    .not_configured .dot { background: #484f58; }

    .card-detail {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #8b949e;
      font-family: monospace;
      word-break: break-all;
    }

    .api-info {
      margin-top: 40px;
      width: 100%;
      max-width: 800px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
    }

    .api-info p {
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .api-info a {
      font-size: 0.85rem;
      color: #58a6ff;
      font-family: monospace;
      text-decoration: none;
    }

    .api-info a:hover { text-decoration: underline; }

    .status-line {
      margin-top: 40px;
      font-size: 0.75rem;
      color: #484f58;
    }

    .error-banner {
      width: 100%;
      max-width: 800px;
      background: #1c1c1c;
      border: 1px solid #da3633;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 0.85rem;
      color: #f85149;
      margin-bottom: 24px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Launchpad Sandbox</h1>
    <p>Live integration status</p>
    <span class="workspace-badge" id="workspace-name">loading...</span>
  </header>

  <div class="error-banner" id="error-banner"></div>

  <div class="grid" id="grid"></div>

  <div class="api-info">
    <p>Raw API response</p>
    <a id="api-link" href="#" target="_blank">—</a>
  </div>

  <p class="status-line" id="status-line">polling...</p>

  <script>
    const hostname = window.location.hostname;
    // demo3.mattjarrett.dev → demo3-api.mattjarrett.dev
    const apiBase = hostname.replace(/^(demo\d+)\./, '$1-api.');
    const apiURL = `https://${apiBase}/`;

    document.getElementById('api-link').href = apiURL;
    document.getElementById('api-link').textContent = apiURL;

    const ICONS = { ok: '✓', unavailable: '✗', not_configured: '—' };
    const LABELS = { ok: 'Connected', unavailable: 'Unreachable', not_configured: 'Not provisioned' };

    function renderGrid(integrations) {
      const grid = document.getElementById('grid');
      grid.innerHTML = integrations.map(i => `
        <div class="card ${i.status}">
          <div class="card-name">${i.name}</div>
          <div class="card-status">
            <div class="dot"></div>
            <span>${LABELS[i.status] ?? i.status}</span>
          </div>
          ${i.detail ? `<div class="card-detail">${i.detail}</div>` : ''}
        </div>
      `).join('');
    }

    async function poll() {
      const banner = document.getElementById('error-banner');
      const statusLine = document.getElementById('status-line');
      try {
        const res = await fetch(apiURL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`API returned ${res.status}`);
        const data = await res.json();
        banner.style.display = 'none';
        document.getElementById('workspace-name').textContent = data.workspace ?? hostname;
        renderGrid(data.integrations ?? []);
        statusLine.textContent = `Last updated ${new Date(data.timestamp).toLocaleTimeString()}`;
      } catch (err) {
        banner.textContent = `Could not reach API: ${err.message}`;
        banner.style.display = 'block';
        statusLine.textContent = 'Retrying in 5s…';
      }
    }

    poll();
    setInterval(poll, 5000);
  </script>
</body>
</html>
