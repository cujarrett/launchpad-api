<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launchpad Sandbox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08090d;
      --surface: #0f1117;
      --border: rgba(255,255,255,0.07);
      --muted: #4b5263;
      --text: #e2e8f0;
      --text-dim: #8892a4;
      --green: #22c55e;
      --red: #f87171;
      --purple: #a78bfa;
      --purple-glow: rgba(124,58,237,0.15);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 24px 80px;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      margin-bottom: 48px;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--purple);
      background: var(--purple-glow);
      border: 1px solid rgba(124,58,237,0.25);
      border-radius: 100px;
      padding: 4px 12px;
      margin-bottom: 16px;
    }

    .hero-label {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 7vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #f8fafc;
      line-height: 1.1;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .hero p {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .workspace-badge { display: none; }

    .launched-at {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── Content column ── */
    .content {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
    }

    /* ── Cards grid ── */
    .grid {
      display: flex;
      flex-wrap: nowrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      flex: 1 1 0;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 16px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .card.ok {
      border-color: rgba(34,197,94,0.3);
      box-shadow: 0 0 0 1px rgba(34,197,94,0.05), inset 0 0 24px rgba(34,197,94,0.04);
    }

    .card.unavailable,
    .card.error,
    .card.starting { border-color: rgba(248,113,113,0.3); }

    .card-name {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .card-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .ok .card-status { color: var(--green); }
    .unavailable .card-status,
    .error .card-status,
    .starting .card-status { color: var(--red); }
    .not_configured .card-status { color: var(--muted); }

    .card-detail {
      margin-top: 8px;
      font-size: 0.72rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--text-dim);
      line-height: 1.4;
      word-break: break-word;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ok .dot {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 2.4s ease-in-out infinite;
    }

    .unavailable .dot,
    .error .dot,
    .starting .dot { background: var(--red); }
    .not_configured .dot { background: var(--muted); }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── API panel ── */
    .api-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      text-align: center;
    }

    .api-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      flex-shrink: 0;
    }

    .api-panel a {
      font-size: 0.8rem;
      color: var(--purple);
      font-family: 'SF Mono', 'Fira Code', monospace;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .api-panel a:hover { text-decoration: underline; }

    /* ── Status line ── */
    .status-line {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
      margin-bottom: 48px;
    }

    /* ── API response ── */
    .api-response {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .api-response-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      display: block;
      margin-bottom: 10px;
    }
    .api-response pre {
      margin: 0;
      font-size: 0.76rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre;
    }
    .json-key  { color: #60a5fa; }
    .json-str  { color: var(--green); }
    .json-bool { color: var(--purple); }
    .json-null { color: var(--muted); }
    .json-num  { color: #fbbf24; }

    /* ── Error banner ── */
    .error-banner {
      width: 100%;
      max-width: 580px;
      background: rgba(248,113,113,0.07);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: var(--red);
      margin-bottom: 20px;
      display: none;
    }

    /* ── Launchpad callout ── */
    .built-with {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15,17,23,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 8px 18px;
      font-size: 0.78rem;
      color: var(--text-dim);
      white-space: nowrap;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .built-with a {
      color: var(--purple);
      text-decoration: none;
      font-weight: 600;
    }

    .built-with a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-eyebrow">&#x1F9EA; Sandbox</div>
    <p class="hero-label">Hello from</p>
    <h1 id="workspace-name">loading&hellip;</h1>
    <p id="launched-at" class="launched-at"></p>
  </header>

  <div class="error-banner" id="error-banner"></div>

  <div class="content">
    <div class="grid" id="grid"><p id="grid-loading" style="grid-column:1/-1;color:var(--text-dim);font-size:0.85rem;">Loading integrations…</p></div>

    <div class="api-response" id="api-response" style="display:none">
      <span class="api-response-label">API Response</span>
      <pre><code id="api-response-code"></code></pre>
    </div>

    <div class="api-panel" id="api-panel" style="display:none">
      <span class="api-label">API</span>
      <a id="api-link" href="#" target="_blank" rel="noopener noreferrer">&mdash;</a>
    </div>

    <p class="status-line" id="status-line"></p>
  </div>

  <div class="built-with">
    🚀 Built in minutes with <a href="https://launchpad.mattjarrett.dev" target="_blank" rel="noopener noreferrer">Launchpad</a>
  </div>

  <script>
    const hostname = window.location.hostname
    const apiBase = hostname.replace(/^(demo\d+)\./, '$1-api.')
    const apiURL = `https://${apiBase}/`

    // Show the slot slug until the API responds with the real workspace name.
    const slotSlug = hostname.split('.')[0]
    document.getElementById('workspace-name').textContent = slotSlug

    let workspaceKnown = false
    let hasData = false

    function setWorkspaceName(raw) {
      if (workspaceKnown) return
      workspaceKnown = true
      const name = raw.replace(/^guest-/, '')
      document.getElementById('workspace-name').textContent = name
      // Key the launched timestamp to this workspace, not the slot —
      // so a recycled slot doesn't show a stale date from a previous occupant.
      const tsKey = 'launched:' + name
      if (!localStorage.getItem(tsKey)) localStorage.setItem(tsKey, Date.now())
      const launchedMs = parseInt(localStorage.getItem(tsKey), 10)
      document.getElementById('launched-at').textContent =
        'Launched ' + new Date(launchedMs).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
    }

    const apiLink = document.getElementById('api-link')
    apiLink.href = apiURL
    apiLink.textContent = apiURL

    function syntaxHighlight(obj) {
      const json = JSON.stringify(obj, null, 2)
      return json.replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
        match => {
          let cls = 'json-num'
          if (/^".+":$/.test(match.trim())) cls = 'json-key'
          else if (/^"/.test(match))       cls = 'json-str'
          else if (/true|false/.test(match)) cls = 'json-bool'
          else if (/null/.test(match))      cls = 'json-null'
          return `<span class="${cls}">${match}</span>`
        }
      )
    }

    const LABELS = { ok: 'Connected', unavailable: 'Unreachable', error: 'Error', starting: 'Starting…', not_configured: 'Not provisioned' }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    }

    function renderGrid(integrations) {
      const grid = document.getElementById('grid')
      grid.innerHTML = integrations.map(i => `
        <div class="card ${i.status}">
          <div class="card-name">${escapeHtml(i.name)}</div>
          <div class="card-status">
            <div class="dot"></div>
            <span>${LABELS[i.status] ?? i.status}</span>
          </div>
          ${i.detail ? `<div class="card-detail">${escapeHtml(i.detail)}</div>` : ''}
        </div>
      `).join('')
    }

    let apiVisible = false

    async function poll() {
      const banner = document.getElementById('error-banner')
      const statusLine = document.getElementById('status-line')
      try {
        const res = await fetch(apiURL, { cache: 'no-store' })
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        const data = await res.json()
        banner.style.display = 'none'
        if (data.workspace) setWorkspaceName(data.workspace)
        hasData = true
        renderGrid(data.integrations ?? [])
        document.getElementById('api-response-code').innerHTML = syntaxHighlight(data)
        document.getElementById('api-response').style.display = ''
        statusLine.textContent = `Updated ${new Date(data.timestamp).toLocaleTimeString()}`
        if (!apiVisible) {
          document.getElementById('api-panel').style.display = ''
          apiVisible = true
        }
      } catch (err) {
        // Network error = no API in this workspace; HTTP errors surface the status
        const noApi = err.message === 'Failed to fetch'
        if (!noApi) {
          banner.textContent = `Could not reach API: ${err.message}`
          banner.style.display = 'block'
          statusLine.textContent = 'Retrying in 5s…'
        } else if (!hasData) {
          const loading = document.getElementById('grid-loading')
          if (loading) loading.textContent = 'Waiting for API\u2026'
        }
      }
    }

    poll()
    setInterval(poll, 5000)
  </script>
</body>
</html>
